[package]
name = "fgit-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "CLI binary for ApexForge Git VCS"

[[bin]]
name = "fgit"
path = "src/main.rs"

[dependencies]
fgit-core = { path = "../fgit-core" }
clap = { version = "4", features = ["derive"] }
colored = "3"
chrono = "0.4"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
