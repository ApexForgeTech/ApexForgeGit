[package]
name = "fgit-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Core library for ApexForge Git VCS"

[dependencies]
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
glob = "0.3"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
zstd = "0.13"
thiserror = "2"
walkdir = "2"
aes-gcm = "0.10"
rand = "0.8"
reqwest = { version = "0.11", features = ["blocking"] }

[dev-dependencies]
tempfile = "3"
